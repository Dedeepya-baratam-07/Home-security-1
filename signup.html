<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Home Security Monitoring System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand-emblem">
        <i data-lucide="user-plus"></i>
      </div>
      <h1>Create Account</h1>
      <p>Set up your smart residence security monitoring</p>
    </div>

    <form id="signup-form" class="auth-form">
      <div class="form-group">
        <label for="signup-name" class="form-label">Full Name</label>
        <div class="input-group">
          <i data-lucide="user" class="input-icon-left"></i>
          <input type="text" id="signup-name" class="form-control has-left-icon" placeholder="e.g. Jane Doe" required>
        </div>
      </div>

      <div class="form-group">
        <label for="signup-email" class="form-label">Email Address</label>
        <div class="input-group">
          <i data-lucide="mail" class="input-icon-left"></i>
          <input type="email" id="signup-email" class="form-control has-left-icon" placeholder="jane@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="signup-phone" class="form-label">Phone Number</label>
        <div class="input-group">
          <i data-lucide="phone" class="input-icon-left"></i>
          <input type="tel" id="signup-phone" class="form-control has-left-icon" placeholder="+1 (555) 000-0000" required>
        </div>
      </div>

      <div class="form-group">
        <label for="signup-password" class="form-label">Create Password</label>
        <div class="input-group">
          <i data-lucide="lock" class="input-icon-left"></i>
          <input type="password" id="signup-password" class="form-control has-left-icon" placeholder="At least 6 characters" required>
          <button type="button" class="input-icon-btn password-toggle-btn" data-target="signup-password" aria-label="Toggle password visibility">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="signup-confirm-password" class="form-label">Confirm Password</label>
        <div class="input-group">
          <i data-lucide="shield-check" class="input-icon-left"></i>
          <input type="password" id="signup-confirm-password" class="form-control has-left-icon" placeholder="Re-enter password" required>
          <button type="button" class="input-icon-btn password-toggle-btn" data-target="signup-confirm-password" aria-label="Toggle password visibility">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </div>

      <!-- Prominent Submit Action Button -->
      <button type="submit" id="signup-submit-btn" class="btn auth-submit-btn btn-full">
        <i data-lucide="user-check"></i>
        <span>Create Account & Enter Dashboard</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a href="index.html">Sign In Here</a>
    </div>
  </div>

  <!-- Shared Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
