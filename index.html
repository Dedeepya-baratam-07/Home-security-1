<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Home Security Monitoring System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand-emblem">
        <i data-lucide="shield-check"></i>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to monitor and control your home security</p>
    </div>

    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="login-email" class="form-label">Email Address</label>
        <div class="input-group">
          <i data-lucide="mail" class="input-icon-left"></i>
          <input type="email" id="login-email" class="form-control has-left-icon" placeholder="name@homeguard.io" required value="alex.mercer@homeguard.io">
        </div>
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <div class="input-group">
          <i data-lucide="lock" class="input-icon-left"></i>
          <input type="password" id="login-password" class="form-control has-left-icon" placeholder="••••••••" required value="Password123!">
          <button type="button" class="input-icon-btn password-toggle-btn" data-target="login-password" aria-label="Toggle password visibility">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </div>

      <div class="auth-options">
        <label class="checkbox-label">
          <input type="checkbox" id="login-remember" checked>
          <span>Remember me</span>
        </label>
        <a href="javascript:void(0)" onclick="UI.showToast('Password reset link sent to registered email in demo mode.', 'info')">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 8px;">
        <i data-lucide="log-in"></i> Sign In to Dashboard
      </button>
    </form>

    <div class="demo-credentials-box">
      <strong>Demo Account Pre-filled:</strong><br>
      Email: <code>alex.mercer@homeguard.io</code> | Pass: <code>Password123!</code>
    </div>

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a href="signup.html">Create an Account</a>
    </div>
  </div>

  <!-- Shared Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
